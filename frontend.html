<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klaxio</title>

    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/material-symbols.css" rel="stylesheet">
    <link href="/css/dm-sans.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
    <link rel="icon" href="/img/app-logo.svg">
</head>

<body class="overflow-hidden" style="min-height:100vh">

    <a id="skip-link" class="visually-hidden-focusable skip-link" href="#main-content">Jump to content</a>

    <button class="btn drawer-toggle drawer-toggle-open" id="drawer-open"
            type="button" data-drawer-toggle
            aria-controls="drawer-nav" aria-expanded="true"
            aria-label="Open menu" title="Open menu">
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
    </button>

    <div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true" hidden>
    </div>

    <aside class="drawer drawer-left show" id="drawer-nav">
        <header class="drawer-header py-1 px-2">
            <div class="drawer-header-content">
                <img src="/img/app-logo.svg" alt="App Icon" class="drawer-logo">
                <span class="drawer-brand">Klaxio</span>
            </div>

            <button id="drawer-close" class="btn drawer-toggle ms-auto" type="button" data-drawer-toggle data-drawer-dismiss
                    aria-controls="drawer-nav" aria-expanded="true"
                    aria-label="Close menu" title="Close menu">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </header>

        <div class="drawer-content">
            <p class="drawer-nav-item drawer-nav-item-static mb-0" role="status">
                <span class="drawer-nav-icon" aria-hidden="true">
                    <span id="conn-dot" class="conn-dot bg-danger"></span>
                </span>
                <span id="conn-text" class="drawer-nav-label text-truncate">Connecting …</span>
            </p>

            <nav class="drawer-nav" aria-label="Main navigation">
                <ul class="list-unstyled mb-0">

                    <li class="drawer-nav-group">
                        <h2 class="drawer-nav-heading">
                            <button class="drawer-nav-item drawer-nav-toggle" type="button"
                                    data-bs-toggle="collapse" data-bs-target="#nav-app"
                                    aria-expanded="true" aria-controls="nav-app">
                                <span class="drawer-nav-chevron" aria-hidden="true">
                                    <span class="collapsed-icon material-symbols-outlined">chevron_right</span>
                                    <span class="expanded-icon material-symbols-outlined">expand_more</span>
                                </span>
                                <span id="nav-app-group-text" class="drawer-nav-label text-truncate">App</span>
                            </button>
                        </h2>

                        <div class="collapse show" id="nav-app">
                            <ul class="list-unstyled mb-0">
                                <li>
                                    <a class="drawer-nav-item drawer-nav-sub" href="/app" aria-current="page">
                                        <span class="drawer-nav-icon" aria-hidden="true">
                                            <span class="material-symbols-outlined">home_app_logo</span>
                                        </span>
                                        <span id="nav-app-sub-text" class="drawer-nav-label text-truncate">App</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>

                    <li class="drawer-nav-group">
                        <h2 class="drawer-nav-heading">
                            <button class="drawer-nav-item drawer-nav-toggle" type="button"
                                    data-bs-toggle="collapse" data-bs-target="#nav-settings"
                                    aria-expanded="true" aria-controls="nav-settings">
                                <span class="drawer-nav-chevron" aria-hidden="true">
                                    <span class="collapsed-icon material-symbols-outlined">chevron_right</span>
                                    <span class="expanded-icon material-symbols-outlined">expand_more</span>
                                </span>
                                <span id="nav-settings-group-text" class="drawer-nav-label text-truncate">Settings</span>
                            </button>
                        </h2>

                        <div class="collapse show" id="nav-settings">
                            <ul class="list-unstyled mb-0">
                                <li class="dropdown">
                                    <button class="drawer-nav-item drawer-nav-sub dropdown-toggle" type="button"
                                            data-bs-toggle="dropdown" data-bs-display="static"
                                            aria-expanded="false">
                                        <span class="drawer-nav-icon" aria-hidden="true">
                                            <span class="material-symbols-outlined">language</span>
                                        </span>
                                        <span class="drawer-nav-label text-truncate">
                                            <span id="nav-language-text">Language: </span><span id="lang-label">EN</span>
                                        </span>
                                    </button>
                                    <ul id="lang-dropdown" class="dropdown-menu" aria-label="Choose language">
                                        <li>
                                            <button class="dropdown-item" type="button" data-lang="en" aria-current="true">English</button>
                                        </li>
                                        <li>
                                            <button class="dropdown-item" type="button" data-lang="de">Deutsch</button>
                                        </li>
                                    </ul>
                                </li>
                            </ul>
                        </div>
                    </li>

                </ul>
            </nav>
        </div>

        <div class="drawer-footer text-center">
            <img src="img/simon-eller-logo.svg" alt="Simon Eller Logo" style="height: 2rem;"/>
        </div>
    </aside>

    <main id="main-content" tabindex="-1" class="p-4" style="height:90vh">
        <div class="d-flex gap-3 h-100">

            <!-- Player 1 -->
            <div class="player-panel card text-bg-light border flex-grow-1 rounded-4" id="panel-0">
                <div class="card-body d-flex flex-column align-items-center justify-content-center gap-3">
                    <h2 class="fw-bold fs-2 text-center" id="name-0">Player 1</h2>
                    <div class="display-1 fw-bold score-badge" id="score-0">0</div>
                    <div class="fs-1 text-center" id="icon-0"></div>
                </div>
            </div>

            <!-- Centre column -->
            <div class="d-flex flex-column align-items-center justify-content-center" style="width:80px; flex-shrink:0">
                <div class="flex-grow-1 border-start"></div>
                <div id="phase-label" class="text-dark small fw-semibold my-2">READY</div>
                <div class="flex-grow-1 border-start"></div>
            </div>

            <!-- Player 2 -->
            <div class="player-panel card text-bg-light border flex-grow-1 rounded-4 position-relative" id="panel-1">
                <div class="rounded-4"></div>
                <div class="card-body d-flex flex-column align-items-center justify-content-center gap-3">
                    <h2 class="fw-bold fs-2 text-center" id="name-1">Player 2</h2>
                    <div class="display-1 fw-bold score-badge" id="score-1">0</div>
                    <div class="fs-1 text-center" id="icon-1"></div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-light p-4 fixed-bottom">
        <div class="d-flex align-items-center justify-content-center gap-2 flex-wrap">
            <button id="btn-arm" class="btn btn-primary fw-semibold icon-link" onclick="send('arm')">
                <span class="material-symbols-outlined">play_arrow</span>
                UNLOCK BUZZERS
            </button>

            <button id="btn-correct" class="btn btn-success fw-semibold icon-link" onclick="send('correct')" disabled>
                <span class="material-symbols-outlined">thumb_up</span>
                Correct
            </button>

            <button id="btn-wrong" class="btn btn-danger fw-semibold icon-link" onclick="send('wrong')" disabled>
                <span class="material-symbols-outlined">thumb_down</span>
                Wrong
            </button>

            <button id="btn-reset" class="btn btn-warning fw-semibold icon-link" onclick="send('reset')" disabled>
                <span class="material-symbols-outlined">refresh</span>
                New Question
            </button>

            <button id="btn-scores" class="btn btn-warning fw-semibold icon-link" onclick="resetScores()">
                <span class="material-symbols-outlined">restart_alt</span>
                Reset Scores
            </button>
        </div>
    </footer>

    <div id="toast" class="badge bg-black rounded-pill px-4 py-2 fs-6 fw-normal"></div>

    <script>
      // i18n
      let S = {};
      let currentLang = "en";

      function applyStrings(strings) {
          S = strings;
          document.getElementById("btn-arm").innerHTML = `<span class="material-symbols-outlined">play_arrow</span> ${S.btnArm ?? "UNLOCK BUZZERS"}`;
          document.getElementById("btn-correct").innerHTML = `<span class="material-symbols-outlined">thumb_up</span> ${S.btnCorrect ?? "Correct"}`;
          document.getElementById("btn-wrong").innerHTML = `<span class="material-symbols-outlined">thumb_down</span> ${S.btnWrong ?? "Wrong"}`;
          document.getElementById("btn-reset").innerHTML = `<span class="material-symbols-outlined">refresh</span> ${S.btnReset ?? "New Question"}`;
          document.getElementById("btn-scores").innerHTML = `<span class="material-symbols-outlined">restart_alt</span> ${S.btnResetScores ?? "Reset Scores"}`;
          document.getElementById("conn-text").textContent = connected
          ? (S.connConnected ?? "Connected") : (S.connConnecting ?? "Connecting...");

          // --- Frontend UI strings ---
          document.getElementById("skip-link").textContent = S.jumpToContent ?? "Jump to content";

          const btnOpen = document.getElementById("drawer-open");
          if (btnOpen) {
              btnOpen.setAttribute("aria-label", S.openMenu ?? "Open menu");
              btnOpen.setAttribute("title", S.openMenu ?? "Open menu");
          }

          const btnClose = document.getElementById("drawer-close");
          if (btnClose) {
              btnClose.setAttribute("aria-label", S.closeMenu ?? "Close menu");
              btnClose.setAttribute("title", S.closeMenu ?? "Close menu");
          }

          document.getElementById("nav-app-group-text").textContent = S.navApp ?? "App";
          document.getElementById("nav-app-sub-text").textContent = S.navApp ?? "App";
          document.getElementById("nav-settings-group-text").textContent = S.navSettings ?? "Settings";
          document.getElementById("nav-language-text").textContent = (S.navLanguage ?? "Language") + ": ";
          document.getElementById("lang-dropdown").setAttribute("aria-label", S.chooseLanguage ?? "Choose language");

          applyPhaseLabel(currentPhase);
      }

      function setLang(lang) {
          currentLang = lang;
          document.getElementById("lang-label").textContent = lang === "de" ? "DE" : "EN";

          document.querySelectorAll("[data-lang]").forEach(function (el) {
              if (el.dataset.lang === lang) {
                  el.setAttribute("aria-current", "true");
              } else {
                  el.removeAttribute("aria-current");
              }
          });

          send("lang_" + currentLang);
      }

      // WebSocket
      const WS_URL = "ws://localhost:8765";
      let ws = null, connected = false, reconnectTimer = null;

      function connect() {
          ws = new WebSocket(WS_URL);
          ws.onopen = () => {
            connected = true;
            const dot = document.getElementById("conn-dot");
            dot.classList.replace("bg-danger", "bg-success");
            dot.classList.add("ok");
            document.getElementById("conn-text").textContent = S.connConnected ?? "Connected";
            toast(S.toastConnected ?? "Server connected ✓");
            clearTimeout(reconnectTimer);
          };
          ws.onclose = () => {
            connected = false;
            const dot = document.getElementById("conn-dot");
            dot.classList.replace("bg-success", "bg-danger");
            dot.classList.remove("ok");
            document.getElementById("conn-text").textContent = S.connReconnecting ?? "Disconnected - reconnecting...";
            reconnectTimer = setTimeout(connect, 2000);
          };

          ws.onerror = () => ws.close();
          ws.onmessage = ({ data }) => {
            try { handleEvent(JSON.parse(data)); } catch(e) { console.error("WS parse error", e); }
          };
      }

      function send(cmd) {
          if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ cmd }));
      }

      // State machine
      let currentPhase = "waiting", currentWinner = null;

      function handleEvent(msg) {
        if (msg.strings) applyStrings(msg.strings);
        if (msg.names) {
          document.getElementById("name-0").textContent = msg.names[0];
          document.getElementById("name-1").textContent = msg.names[1];
        }
          switch (msg.event) {
            case "init":
                document.getElementById("name-0").textContent = msg.names[0];
                document.getElementById("name-1").textContent = msg.names[1];
                updateScores(msg.scores);
                applyPhase(msg.phase, null);
                break;
            case "armed": applyPhase("armed",   null); break;
            case "buzzed":
              applyPhase("buzzed",  msg.winner);
              toast((S.toastBuzzed ?? "{0} buzzed first!").replace("{0}", msg.name));
              break;
            case "correct":
              applyPhase("correct", msg.winner);
              updateScores(msg.scores, msg.winner);
              break;
            case "wrong":
              applyPhase("wrong",   msg.winner);
              break;
            case "reset":
              applyPhase("waiting", null);
              break;
            case "reset_scores":
              updateScores(msg.scores);
              applyPhase("waiting", null);
              break;
          }
      }

      function applyPhase(phase, winner) {
        currentPhase = phase; currentWinner = winner;

        [0, 1].forEach(i => {
          const panel = document.getElementById(`panel-${i}`);

          panel.classList.remove(
            "bg-light", "bg-info", "bg-success", "bg-danger", "bg-warning",
            "text-bg-light", "text-bg-info", "text-bg-success", "text-bg-danger", "text-bg-warning", "text-bg-dark", "opacity-25"
          );

          // Setze den Standard-Hintergrund inkl. korrekter Textfarbe zurück
          panel.classList.add("text-bg-light");

          document.getElementById(`icon-${i}`).innerHTML = phaseIcon(phase, i, winner);
        });

        if (winner !== null) {
          const winnerPanel = document.getElementById(`panel-${winner}`);
          const loserPanel = document.getElementById(`panel-${1 - winner}`);

          // Standardhintergrund entfernen
          winnerPanel.classList.remove("text-bg-light");
          loserPanel.classList.remove("text-bg-light");

          // Winner panel status (nur text-bg-* Klassen um Hintergrund + Textkontrast zu setzen)
          if (phase === "buzzed") {
              winnerPanel.classList.add("text-bg-info");
          } else if (phase === "correct") {
              winnerPanel.classList.add("text-bg-success");
          } else if (phase === "wrong") {
              winnerPanel.classList.add("text-bg-danger");
          }

          // Loser panel status auf Grau und leicht transparent (ausgegraut)
          loserPanel.classList.add("text-bg-dark", "opacity-25");
        }

        applyPhaseLabel(phase);
        document.getElementById("btn-arm").disabled = phase === "armed" || phase === "buzzed";
        document.getElementById("btn-correct").disabled = phase !== "buzzed";
        document.getElementById("btn-wrong").disabled = phase !== "buzzed";
        document.getElementById("btn-reset").disabled = phase === "waiting" || phase === "armed";
    }

      function applyPhaseLabel(phase) {
          const el = document.getElementById("phase-label");
          el.className = `text-dark small fw-semibold my-2 ${phase}`;
          const map = {
            waiting: S.phaseReady   ?? "READY",
            armed:   S.phaseArmed   ?? "BUZZ!",
            buzzed:  S.phaseBuzzed  ?? "BUZZED",
            correct: S.phaseCorrect ?? "CORRECT",
            wrong:   S.phaseWrong   ?? "WRONG",
          };
          el.textContent = map[phase] ?? phase.toUpperCase();
      }

      function phaseIcon(phase, idx, winner) {
          const icon = name => `<span class="material-symbols-outlined fs-1">${name}</span>`;

          if (phase === "armed") return icon("my_location");
          if (phase === "buzzed"  && idx === winner) return icon("notifications_active");
          if (phase === "correct" && idx === winner) return icon("check_circle");
          if (phase === "wrong"   && idx === winner) return icon("cancel");
          if (["buzzed","correct","wrong"].includes(phase) && idx !== winner) return icon("hourglass_empty");
          return icon("radio_button_unchecked");
      }

      function updateScores(scores, bumped = null) {
          [0, 1].forEach(i => {
            const el = document.getElementById(`score-${i}`);
            el.textContent = scores[i];

            if (i === bumped) {
                el.classList.remove("bump");
                void el.offsetWidth;
                el.classList.add("bump");
            }
          });
      }

      function resetScores() {
        if (confirm(S.confirmReset ?? "Really reset scores?")) send("reset_scores");
      }

      // Keyboard shortcuts
      document.addEventListener("keydown", e => {
          if (e.target.closest("input, textarea, select, button, a, [contenteditable]")) return;

          if (e.code === "Space" || e.code === "Enter") {
            e.preventDefault();
            if (currentPhase === "waiting") send("arm");
            else if (currentPhase !== "armed") send("reset");
          }

          if (e.key === "+" || e.key === "1") send("correct");
          if (e.key === "-" || e.key === "0") send("wrong");
          if (e.key === "r" || e.key === "R") send("reset");
      });

      // Toast
      let toastTimer = null;
      function toast(msg) {
          const el = document.getElementById("toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
      }

      // Drawer
      (function () {
          'use strict';

          var STORAGE_KEY = 'drawer-open-left';
          var drawer   = document.getElementById('drawer-nav');
          var backdrop = document.getElementById('drawer-backdrop');
          var main     = document.getElementById('main-content');
          var openBtn  = document.getElementById('drawer-open');
          var wide     = window.matchMedia('(min-width: 768px)');

          if (!drawer) {
              return;
          }

          var togglers = document.querySelectorAll('[data-drawer-toggle]');

          function isOpen() {
              return drawer.classList.contains('show');
          }

          function setDrawer(open, options) {
              options = options || {};

              var overlay = open && !wide.matches;
              var focusWasInside = drawer.contains(document.activeElement);

              drawer.classList.toggle('show', open);
              document.body.classList.toggle('drawer-open-left', open);

              togglers.forEach(function (btn) {
                  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
              });

              if (backdrop) {
                  backdrop.hidden = !overlay;
              }

              if (main) {
                  main.inert = overlay;
              }

              if (options.manageFocus !== false) {
                  if (overlay) {
                      var dismiss = drawer.querySelector('[data-drawer-dismiss]');
                      if (dismiss) {
                          dismiss.focus();
                      }
                  } else if (!open && focusWasInside && openBtn) {
                      openBtn.focus();
                  }
              }

              if (options.remember !== false) {
                  try {
                      localStorage.setItem(STORAGE_KEY, open ? '1' : '0');
                  } catch (e) {}
              }
          }

          togglers.forEach(function (btn) {
              btn.addEventListener('click', function () {
                  setDrawer(!isOpen());
              });
          });

          if (backdrop) {
              backdrop.addEventListener('click', function () {
                  setDrawer(false);
              });
          }

          document.addEventListener('keydown', function (e) {
              if (e.key === 'Escape' && isOpen() && !wide.matches) {
                  setDrawer(false);
              }
          });

          wide.addEventListener('change', function () {
              setDrawer(isOpen(), { remember: false, manageFocus: false });
          });

          var stored = null;
          try {
              stored = localStorage.getItem(STORAGE_KEY);
          } catch (e) {
              stored = null;
          }
          setDrawer(stored === null ? wide.matches : stored === '1', {
              remember: false,
              manageFocus: false
          });
          document.body.classList.add('drawers-ready');
      }());

      (function () {
          'use strict';
          document.addEventListener('click', function (e) {
              var btn = e.target.closest('[data-lang]');
              if (btn && typeof window.setLang === 'function') {
                  window.setLang(btn.dataset.lang);
              }
          });
      }());

      connect();
    </script>

    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
